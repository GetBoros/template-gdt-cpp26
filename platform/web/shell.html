<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>$GODOT_PROJECT_NAME</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* Полная прозрачность для OBS Browser Source */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Стильный оверлей загрузки */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0e0e10; /* Темный фон Twitch во время первой секунды загрузки */
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }

        /* Неоновый спиннер */
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(145, 70, 255, 0.15);
            border-top: 3px solid #9146ff; /* Фирменный Twitch Purple */
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-title {
            margin-top: 20px;
            color: #efeff1;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        /* Тонкая неоновая полоска прогресса */
        .progress-track {
            width: 160px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            margin-top: 15px;
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #9146ff;
            box-shadow: 0 0 10px #9146ff;
            transition: width 0.15s ease-out;
        }

        #error-notice {
            margin-top: 15px;
            color: #eb0400;
            font-size: 12px;
            max-width: 80%;
            text-align: center;
        }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
    $GODOT_HEAD_INCLUDE
</head>
<body>
    <canvas id="canvas">
        HTML5 canvas is not supported in your browser.
    </canvas>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-title">Loading Overlay...</div>
        <div class="progress-track">
            <div id="progress-fill"></div>
        </div>
        <div id="error-notice"></div>
    </div>

    <script src="$GODOT_URL"></script>
    <script>
        const GODOT_CONFIG = $GODOT_CONFIG;
        const engine = new Engine(GODOT_CONFIG);

        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progress-fill');
        const errorNotice = document.getElementById('error-notice');

        engine.startGame({
            onProgress: function (current, total) {
                if (total > 0) {
                    const percent = Math.floor((current / total) * 100);
                    progressFill.style.width = percent + '%';
                }
            },
            onPrintError: function (text) {
                console.error(text);
                errorNotice.innerText = text;
            }
        }).then(function () {
            // Загрузка завершена: плавно растворяем лоадер и открываем прозрачный оверлей
            loadingScreen.style.opacity = '0';
            setTimeout(function () {
                loadingScreen.style.display = 'none';
            }, 600);
        });
    </script>
</body>
</html>
